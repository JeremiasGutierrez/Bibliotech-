<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bibliotech - Registro</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body class="auth-page">
    <main class="auth-wrap">
        <a class="auth-back" href="/">← Volver al inicio</a>
        <section class="w3-card-4 vault-card auth-card w3-padding-large w3-round-large">
            <h1 class="w3-center w3-text-teal"><b>BIBLIOTECH</b></h1>
            <p class="w3-center">Creá tu cuenta de estudiante para acceder a los materiales.</p>
            
            <form id="registerForm">
                <label for="username">Nombre de usuario</label>
                <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="text" id="username" required>
                
                <br>
                <label for="password">Contraseña (mínimo 5 caracteres)</label>
                <!-- Se confía en validation_middleware del backend para evaluar los 6 caracteres mínimos -->
                <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="password" id="password" autocomplete="new-password" minlength="5" required>
                
                <br>
                <button type="submit" class="w3-button w3-teal w3-block w3-round-large"><b>REGISTRARSE</b></button>
            </form>
            
            <p class="w3-small w3-center">¿Ya tienes cuenta? <a href="/login" class="w3-text-teal">Inicia Sesión</a></p>
        </section>
    </main>

    <script src="../js/services/api_service.js"></script>
    <script src="../js/components/ui_handlers.js"></script>
    <script src="../js/utils/auth_helper.js"></script>
    <script src="../js/front_controllers/auth_front_controller.js"></script>
</body>
</html>
